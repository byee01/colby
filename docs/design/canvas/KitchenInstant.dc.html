<helmet>

a{color:#c7c7c7}a:hover{color:#f5f5f5}

<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #000000; color: #f5f5f5; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">

<span style="font-weight: 600; color: #f5f5f5">Kitchen mode</span><span class="num">13:20</span>
<span style="flex: 1 1 auto"></span>
<a href="InstantRead.dc.html">Esc · Exit kitchen mode</a>
</header>
<div style="flex: 1 1 auto; margin: 8px 28px 28px; background: #161616; border: 2px solid #2c2c2c; border-radius: 28px; padding: 36px 44px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 20px">
<span class="num" style="width: 64px; height: 64px; border-radius: 50%; background: #2a2a2a; box-shadow: 0 0 0 4px #e9c440; display: inline-flex; align-items: center; justify-content: center; font-size: 38px">1</span>

</div>
<span style="font-size: 40px; font-weight: 600; color: #c7c7c7; margin-top: 12px">Tip temperature</span>
<div style="display: flex; align-items: baseline"><span class="num" style="font-size: 460px; font-weight: 500; line-height: 0.86">142</span><span class="num" style="font-size: 180px; font-weight: 500; color: #c7c7c7">.3°</span></div>
</div>
</div>
</x-dc>
