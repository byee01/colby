<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colby history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#f5f5f5}a:hover{color:#ffffff}
.num{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.btn{background:#1f1f1f;color:#f5f5f5;border:1px solid #2c2c2c;border-radius:10px;padding:8px 14px;font:600 14px 'Barlow',system-ui,sans-serif;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.danger{color:#ff9a9d;border-color:#4a1f21}
.item{background:transparent;border:0;border-bottom:1px solid #222222;padding:14px 10px;text-align:left;cursor:pointer;color:#f5f5f5;font-family:'Barlow',system-ui,sans-serif;display:flex;align-items:center;gap:14px;width:100%;min-height:44px}
.item.on{background:#161616;border-radius:14px}
.unit{display:inline-flex;flex-direction:column;font-size:12px;line-height:1;color:#9b9b9b;margin-left:3px}
.pill{display:inline-block;border-radius:999px;padding:3px 14px;font:600 15px 'Barlow',system-ui,sans-serif;color:#000000}
.lbl{position:absolute;pointer-events:none;white-space:nowrap}
</style>
</helmet>
<div style="min-height: 900px; background: #000000; color: #f5f5f5; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #2c2c2c">
<a class="btn" href="Main.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Live</a>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">History</h1>
<span style="font-size: 14px; color: #9b9b9b">{{countLabel}}</span>
</header>
<main style="display: flex; flex-wrap: wrap; gap: 20px; padding: 16px 20px 20px; flex: 1 1 auto; align-items: flex-start">
<nav aria-label="Past cooks" style="flex: 1 1 420px; max-width: 520px; min-width: 0; display: flex; flex-direction: column">
<sc-for list="{{items}}" as="c" hint-placeholder-count="6">
<button type="button" class="{{c.cls}}" onClick="{{c.pick}}">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #1c1c1c; border: 1px solid #333333; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5l5 5-8 8-5-5z" fill="#ffc21a"></path><path d="M7.5 11.5l5 5-1.5 1.5-5-5z" fill="#cfcfcf"></path><path d="M6 16l2 2-4 4-1-1z" fill="#9b9b9b"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0">
<span style="font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
<span style="display: flex; align-items: center; gap: 14px"><span class="num" style="font-size: 26px; font-weight: 500; display: inline-flex; align-items: center">{{c.dur}}<span class="unit"><span>{{c.u1}}</span><span>{{c.u2}}</span></span></span><sc-if value="{{c.hasTarget}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9b9b9b" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 12l-4-4"></path></svg><span class="num" style="font-size: 24px; font-weight: 500">{{c.target}}</span></span></sc-if></span>
<span style="font-size: 14px; color: #9b9b9b">{{c.when}}</span>
</span>
<svg viewBox="0 0 160 90" style="width: 150px; height: 84px; flex: none; background: #000000; border: 2px solid #1f1f1f; border-radius: 18px" aria-hidden="true">
<path d="{{c.amb}}" fill="none" stroke="#f5701f" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="{{c.surf}}" fill="none" stroke="#ffb81c" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="{{c.core}}" fill="none" stroke="#4ea1f7" stroke-width="2.5" stroke-linejoin="round"></path>
</svg>
</button>
</sc-for>
</nav>

<section aria-label="Cook detail" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><h2 style="margin: 0; font-size: 32px; font-weight: 700">{{d.title}}</h2><span style="font-size: 14px; color: #9b9b9b">{{d.kind}}</span></div>
<button type="button" class="btn">Rename</button>
<button type="button" class="btn danger">Delete cook</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<sc-for list="{{readouts}}" as="r" hint-placeholder-count="3">
<div style="{{r.cell}}"><span class="pill" style="{{r.pill}}">{{r.label}}</span><span class="num" style="font-size: 64px; font-weight: 500; line-height: 1">{{r.value}}</span></div>
</sc-for>
</div>
<div style="background: #161616; border: 1px solid #2c2c2c; border-radius: 28px; padding: 16px 22px 10px; display: flex; flex-direction: column">
<div style="display: flex; flex-direction: column; align-items: center; min-height: 46px"><span style="font-size: 18px; color: #c7c7c7">{{scrubState}}</span><span class="num" style="font-size: 20px; font-weight: 600">{{scrubTime}}</span></div>
<div style="position: relative">
<svg viewBox="0 0 1000 400" style="width: 100%; height: auto; display: block" role="img" aria-label="{{d.graphLabel}}">
<sc-for list="{{yTicks}}" as="t" hint-placeholder-count="5"><line x1="60" x2="940" y1="{{t.y}}" y2="{{t.y}}" stroke="#2a2a2a" stroke-width="1.5"></line></sc-for>
<sc-for list="{{xTicks}}" as="t" hint-placeholder-count="4"><line x1="{{t.x}}" x2="{{t.x}}" y1="10" y2="360" stroke="#2a2a2a" stroke-width="1.5"></line></sc-for>
<rect x="60" y="10" width="880" height="350" fill="none" stroke="#2a2a2a" stroke-width="1.5"></rect>
<line x1="60" x2="940" y1="{{targetY}}" y2="{{targetY}}" stroke="#d9d9d9" stroke-width="1.5" opacity="{{targetOp}}"></line>
<sc-for list="{{paths}}" as="p" hint-placeholder-count="3"><path d="{{p.d}}" fill="none" stroke="{{p.color}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></sc-for>
<sc-if value="{{hasHover}}" hint-placeholder-val="{{ false }}">
<line x1="{{cx}}" x2="{{cx}}" y1="10" y2="360" stroke="#d9d9d9" stroke-width="2.5"></line>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><circle cx="{{cx}}" cy="{{d.y}}" r="10" fill="{{d.color}}" stroke="#ffffff" stroke-width="3"></circle></sc-for>
</sc-if>
<rect x="60" y="10" width="880" height="350" fill="transparent" onMouseMove="{{onMove}}" onMouseLeave="{{onLeave}}"></rect>
</svg>
<sc-for list="{{yTicks}}" as="t" hint-placeholder-count="5"><span class="lbl num" style="{{t.style}}">{{t.label}}</span></sc-for>
<sc-for list="{{xTicks}}" as="t" hint-placeholder-count="4"><span class="lbl num" style="{{t.style}}">{{t.label}}</span></sc-for>
<span class="lbl num" style="{{targetLabelStyle}}">{{targetLabel}}</span>
</div>
</div>
<div style="background: #161616; border: 1px solid #2c2c2c; border-radius: 28px; padding: 18px 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; color: #c7c7c7">Start <span style="font-size: 18px; color: #9b9b9b">· {{d.date}}</span></span><span class="num" style="font-size: 44px; font-weight: 500; line-height: 1">{{d.start}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; color: #c7c7c7">End</span><span class="num" style="font-size: 44px; font-weight: 500; line-height: 1">{{d.end}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; color: #c7c7c7">Duration</span><span class="num" style="font-size: 44px; font-weight: 500; line-height: 1; display: inline-flex; align-items: center">{{d.dur}}<span class="unit" style="font-size: 15px"><span>{{d.u1}}</span><span>{{d.u2}}</span></span></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #c7c7c7">Alerts during this cook</span>
<sc-for list="{{d.events}}" as="e" hint-placeholder-count="2">
<div style="display: flex; gap: 12px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #222222"><span class="num" style="width: 60px; color: #9b9b9b; font-size: 16px">{{e.clock}}</span><span style="flex: 1 1 auto">{{e.label}}</span><span style="color: #9b9b9b">{{e.note}}</span></div>
</sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, hover: null };
  }
  renderVals() {
    const COL = { core: '#4ea1f7', surf: '#ffb81c', amb: '#f5701f' };
    const COOKS = [
      { title: 'Brisket', day: 'Sat', date: '11 Oct', ago: '7d ago', start: 370, dur: 702, c0: 38, peak: 204, target: 203, amb: [[0, 72], [12, 250], [702, 252]], events: [{ t: 697, label: '5-minute warning', note: 'Acknowledged' }, { t: 702, label: 'Ready · 203°F', note: 'Acknowledged after 2 min' }] },
      { title: 'Ribs', day: 'Sun', date: '5 Oct', ago: '13d ago', start: 720, dur: 310, c0: 40, peak: 205, target: 203, amb: [[0, 70], [10, 275], [120, 275], [130, 240], [310, 240]], events: [{ t: 305, label: 'Ready · 203°F', note: 'Snoozed once' }] },
      { title: 'Manual Cook', day: 'Sun', date: '5 Oct', ago: '13d ago', start: 700, dur: 2, c0: 72, peak: 72, drop: 40, amb: [[0, 72], [2, 72]], events: [] },
      { title: 'Pork shoulder', day: 'Sat', date: '27 Sep', ago: '21d ago', start: 300, dur: 785, c0: 40, peak: 201, target: 200, amb: [[0, 70], [15, 250], [785, 248]], events: [{ t: 410, label: 'Stall · core +1° in 30 min', note: 'Dismissed' }, { t: 785, label: 'Ready · 200°F', note: 'Acknowledged' }] },
      { title: 'Salmon', day: 'Sat', date: '20 Sep', ago: '28d ago', start: 1110, dur: 34, c0: 38, peak: 126, target: 125, amb: [[0, 70], [4, 400], [30, 400], [34, 120]], events: [{ t: 34, label: 'Ready · 125°F', note: 'Acknowledged' }] },
      { title: 'Turkey breast', day: 'Sun', date: '14 Sep', ago: '34d ago', start: 900, dur: 192, c0: 40, peak: 161, target: 160, amb: [[0, 70], [10, 325], [192, 325]], events: [{ t: 120, label: 'Disconnected for 2 min', note: 'Reconnected via Display' }, { t: 192, label: 'Ready · 160°F', note: 'Acknowledged' }] }
    ];
    const clock = (m) => { m = Math.round(m) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
    const dur = (m) => m >= 60 ? { v: Math.floor(m / 60) + ':' + String(Math.round(m % 60)).padStart(2, '0'), u1: 'hrs', u2: 'min' } : m >= 1 ? { v: Math.floor(m) + ':' + String(Math.round((m % 1) * 60)).padStart(2, '0'), u1: 'min', u2: 'sec' } : { v: '0:' + String(Math.round(m * 60)).padStart(2, '0'), u1: 'min', u2: 'sec' };
    const ambAt = (c, t) => { const a = c.amb; for (let i = 1; i < a.length; i++) if (t <= a[i][0]) { const f = (t - a[i - 1][0]) / Math.max(0.001, a[i][0] - a[i - 1][0]); return a[i - 1][1] + (a[i][1] - a[i - 1][1]) * f; } return a[a.length - 1][1]; };
    const series = (c, t) => {
      const f = Math.min(1, Math.max(0, t / c.dur));
      const amb = ambAt(c, t) + 2 * Math.sin(t / 3);
      let core;
      if (c.drop) core = c.c0 - c.drop * (1 - Math.exp(-6 * f));
      else core = c.c0 + (c.peak - c.c0) * (1 - Math.exp(-2.6 * f)) / (1 - Math.exp(-2.6));
      const surf = c.drop ? core + 5 : core + (amb - core) * (0.35 - 0.2 * f) * Math.min(1, t / Math.max(1, c.dur * 0.05) + 0.1);
      return { core, surf, amb };
    };
    const thumb = (c) => {
      const pts = { core: [], surf: [], amb: [] };
      const vals = []; for (let i = 0; i <= 60; i++) vals.push(series(c, c.dur * i / 60));
      const lo = Math.min.apply(null, vals.map((v) => Math.min(v.core, v.surf))) - 5, hi = Math.max.apply(null, vals.map((v) => v.amb)) + 5;
      vals.forEach((v, i) => { const x = (8 + i * 144 / 60).toFixed(1); const y = (k) => (82 - (v[k] - lo) / (hi - lo) * 74).toFixed(1); pts.core.push(x + ',' + y('core')); pts.surf.push(x + ',' + y('surf')); pts.amb.push(x + ',' + y('amb')); });
      return { core: 'M' + pts.core.join(' L'), surf: 'M' + pts.surf.join(' L'), amb: 'M' + pts.amb.join(' L') };
    };
    const items = COOKS.map((c, i) => { const d = dur(c.dur); const th = thumb(c); return {
      title: c.title === 'Manual Cook' ? 'Manual Cook' : c.title, dur: d.v, u1: d.u1, u2: d.u2, hasTarget: !!c.target, target: c.target ? c.target + '°F' : '',
      when: c.ago + ' • ' + c.date + ' ' + clock(c.start), core: th.core, surf: th.surf, amb: th.amb,
      cls: 'item' + (i === this.state.sel ? ' on' : ''), pick: () => this.setState({ sel: i, hover: null }) }; });
    const c = COOKS[this.state.sel];
    const W = 1000, H = 400, L = 60, R = 60, T = 10, B = 40;
    const PX = (x) => (x / W * 100).toFixed(2) + '%', PY = (y) => (y / H * 100).toFixed(2) + '%';
    const X = (t) => L + (t / c.dur) * (W - L - R);
    const allMax = Math.max.apply(null, c.amb.map((a) => a[1]).concat([c.peak, c.target || 0]));
    const ymax = Math.ceil((allMax + 20) / 50) * 50, ymin = c.drop ? 0 : 50;
    const Y = (v) => T + (1 - (v - ymin) / (ymax - ymin)) * (H - T - B);
    const pts = { core: [], surf: [], amb: [] };
    for (let i = 0; i <= 220; i++) { const t = c.dur * i / 220; const s = series(c, t); ['core', 'surf', 'amb'].forEach((k) => pts[k].push(X(t).toFixed(1) + ',' + Y(Math.max(ymin, s[k])).toFixed(1))); }
    const paths = [{ d: 'M' + pts.amb.join(' L'), color: COL.amb }, { d: 'M' + pts.surf.join(' L'), color: COL.surf }, { d: 'M' + pts.core.join(' L'), color: COL.core }];
    const step = ymax - ymin > 300 ? 100 : 50;
    const yTicks = []; for (let v = Math.ceil((ymin + 1) / step) * step; v <= ymax; v += step) yTicks.push({ y: Y(v), label: v + '°', style: 'font-size:16px;color:#9b9b9b;left:0;width:' + PX(L - 10) + ';text-align:right;top:' + PY(Y(v)) + ';transform:translateY(-50%)' });
    const xs = c.dur > 480 ? 120 : c.dur > 150 ? 60 : c.dur > 30 ? 15 : c.dur > 5 ? 5 : 1;
    const xTicks = []; for (let t = Math.ceil(c.start / xs) * xs - c.start; t <= c.dur; t += xs) xTicks.push({ x: X(t), label: clock(c.start + t), style: 'font-size:16px;color:#9b9b9b;left:' + PX(X(t)) + ';top:' + PY(H - B + 10) + ';transform:translateX(-50%)' });
    const h = this.state.hover;
    const at = h === null ? c.dur : Math.max(0, Math.min(c.dur, h));
    const cur = series(c, at);
    const stateAt = (t) => !c.target ? 'Manual' : t >= c.dur - 1 ? 'Ready' : t < c.dur * 0.08 ? 'Warming' : 'Predicting';
    const cell = (i) => 'display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:4px 24px;' + (i > 0 ? 'border-left:3px solid #2c2c2c' : 'padding-left:4px');
    const readouts = [['Core', cur.core, COL.core], ['Surface', cur.surf, COL.surf], ['Ambient', cur.amb, COL.amb]].map((r, i) => ({ label: r[0], value: Math.round(r[1]), pill: 'background:' + r[2], cell: cell(i) }));
    const d = dur(c.dur);
    return {
      items, readouts, paths, yTicks, xTicks, countLabel: COOKS.length + ' cooks · kept until you delete them',
      hasHover: h !== null, cx: X(at),
      dots: [{ y: Y(Math.max(ymin, cur.amb)), color: COL.amb }, { y: Y(Math.max(ymin, cur.surf)), color: COL.surf }, { y: Y(Math.max(ymin, cur.core)), color: COL.core }],
      scrubState: h === null ? 'End of cook' : stateAt(at), scrubTime: clock(c.start + at),
      targetY: c.target ? Y(c.target) : -20, targetOp: c.target ? 1 : 0, targetLabel: c.target ? c.target + '°' : '',
      targetLabelStyle: 'font-size:18px;color:#f5f5f5;left:' + PX(W - R + 8) + ';top:' + PY(c.target ? Y(c.target) : -40) + ';transform:translateY(-50%)',
      onMove: (e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ hover: (e.clientX - r.left) / r.width * c.dur }); },
      onLeave: () => this.setState({ hover: null }),
      d: { title: c.title, kind: (c.target ? 'Predictive Cook · cooking to ' + c.target + '°F' : 'Manual Cook') + ' · Probe 1', date: c.date, start: clock(c.start), end: clock(c.start + c.dur), dur: d.v, u1: d.u1, u2: d.u2,
        events: c.events.map((e) => ({ clock: clock(c.start + e.t), label: e.label, note: e.note })),
        graphLabel: 'Core, surface and ambient temperature for ' + c.title + '. Move the pointer over the graph to read values.' }
    };
  }
}
</script>
</body>
</html>
